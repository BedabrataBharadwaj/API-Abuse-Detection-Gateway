spring.application.name=api-abuse-detection-gateway
server.port=8080

# ---------- Database (credentials come from environment variables) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/api_gateway_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- Abuse rule thresholds ----------
rate-limit.max-requests=100
rate-limit.window-seconds=60

burst.max-requests=20
burst.window-seconds=5

auth-failure.max-attempts=10
auth-failure.window-seconds=60

error-rate.max-errors=20
error-rate.window-seconds=60

# ---------- Gateway ----------
# was: target-api.base-url=http://localhost:8080
target-api.base-url=${TARGET_API_URL:http://localhost:8080}

# empty = any HTTP 401 counts as an auth failure; set to /login to count only login paths
auth-failure.endpoint-suffix=

# lets the gateway forward PUT/PATCH/DELETE form bodies unchanged
spring.mvc.formcontent.filter.enabled=false

target-api.timeout-seconds=5
history.lookback-seconds=60